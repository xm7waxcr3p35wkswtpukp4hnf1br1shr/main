<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="keywords" content="gothviolence, gothviolence.com" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>gothviolence.com</title>
    <style>
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: black;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
            z-index: -1;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-sizing: border-box;
            background-color: black;
        }

        .doors-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .doors-row a {
            display: flex;
            flex: 0 1 auto;
        }

        .doors-row img {
            max-width: 30vw;
            max-height: 45vh;
            object-fit: contain;
        }

        .budka {
            display: flex;
            padding: 0;
            background: transparent;
        }

        .budka img {
            width: 80px;
            height: auto;
            display: block;
        }

        .center-link {
            display: block;
            width: 300px;
            height: 300px;
        }

        .center-link img {
            width: 300px;
            height: 300px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="bg1" class="bg-layer" style="opacity: 1;"></div>
    <div id="bg2" class="bg-layer" style="opacity: 0;"></div>

    <div class="budka">
        <a href="https://t.me/sdfsfsfsfsdd" target="_blank" rel="noopener noreferrer">
            <img src="image/index/budka.png" alt="">
        </a>
    </div>

    <div class="doors-row">
        <a href="md/index/handler.html?v=vid_1.mp4">
            <img src="image/index/door_1.png" alt="">
        </a>
        <a href="md/index/handler.html?v=vid_2.mp4">
            <img src="image/index/door_2.png" alt="">
        </a>
    </div>

    <a href="https://mylittlemushroom.fun" target="_blank" rel="noopener noreferrer" class="center-link">
        <img src="image/index/tshirt.png" alt="">
    </a>

    <audio id="bg-track" src="md/index/aud_1.mp3" autoplay loop playsinline style="display: none;"></audio>

    <script>
        (function() {
            const IMAGE_FOLDER = "image/index/";
            const INTERVAL_MS = 2000;

            const imageFilenames = [
                "int_1.jpg", "int_2.jpg", "int_3.jpg", "int_4.jpg", "int_5.jpg", "int_6.jpg",
                "int_7.jpg", "int_8.jpg", "int_9.jpg", "int_10.jpg", "int_11.jpg",
                "int_12.jpg", "int_13.jpg", "int_14.jpg", "int_15.jpg", "int_16.jpg",
                "int_17.jpg", "int_18.jpg", "int_19.jpg", "int_20.jpg", "int_21.jpg",
                "int_22.jpg", "int_23.jpg", "int_24.jpg", "int_25.jpg", "int_26.jpg",
                "int_27.jpg", "int_28.jpg", "int_29.jpg", "int_30.jpg", "int_31.jpg",
                "int_32.jpg", "int_33.jpg", "int_34.jpg", "int_35.jpg", "int_36.jpg",
                "int_37.jpg", "int_38.jpg", "int_39.jpg", "int_40.jpg", "int_41.jpg",
                "int_42.jpg", "int_43.jpg", "int_44.jpg", "int_45.jpg", "int_46.jpg",
                "int_47.jpg", "int_48.jpg", "int_49.jpg", "int_50.jpg", "int_51.jpg",
                "int_52.jpg", "int_53.jpg", "int_54.jpg", "int_55.jpg", "int_56.jpg",
                "int_57.jpg", "int_58.jpg", "int_59.jpg", "int_60.jpg", "int_61.jpg",
                "int_62.jpg", "int_63.jpg", "int_64.jpg", "int_65.jpg", "int_66.jpg",
                "int_67.jpg", "int_68.jpg", "int_69.jpg", "int_70.jpg", "int_71.jpg",
                "int_72.jpg", "int_73.jpg", "int_74.jpg", "int_75.jpg", "int_76.jpg",
                "int_77.jpg", "int_78.jpg", "int_79.jpg", "int_80.jpg", "int_81.jpg",
                "int_82.jpg", "int_83.jpg", "int_84.jpg", "int_85.jpg", "int_86.jpg",
                "int_87.jpg", "int_88.jpg", "int_89.jpg", "int_90.jpg", "int_91.jpg",
                "int_92.jpg", "int_93.jpg", "int_94.jpg", "int_95.jpg", "int_96.jpg",
                "int_97.jpg", "int_98.jpg", "int_99.jpg", "int_100.jpg"
            ];

            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            const layer1 = document.getElementById('bg1');
            const layer2 = document.getElementById('bg2');
            const layers = [layer1, layer2];

            if (!layer1 || !layer2) return;

            function preloadImage(filename) {
                return new Promise((resolve) => {
                    const img = new Image();
                    const url = IMAGE_FOLDER + filename;
                    img.onload = () => resolve(url);
                    img.onerror = () => resolve(null);
                    img.src = url;
                });
            }

            let shuffled = [];
            let activeLayer = 0;
            let currentImageIndex = 0;
            let ready = false;
            let lastChangeTime = performance.now();
            let rafId = null;

            function switchToImage(newIndex) {
                if (newIndex === currentImageIndex) return;
                const nextLayer = 1 - activeLayer;
                layers[nextLayer].style.backgroundImage = `url('${shuffled[newIndex]}')`;
                layers[activeLayer].style.opacity = '0';
                layers[nextLayer].style.opacity = '1';
                activeLayer = nextLayer;
                currentImageIndex = newIndex;
            }

            function updateBackground(now) {
                if (!ready) {
                    rafId = requestAnimationFrame(updateBackground);
                    return;
                }
                if (now - lastChangeTime >= INTERVAL_MS) {
                    const steps = Math.floor((now - lastChangeTime) / INTERVAL_MS);
                    let newIndex = currentImageIndex + steps;

                    while (newIndex >= shuffled.length) {
                        shuffled = shuffleArray(shuffled);
                        newIndex -= shuffled.length;
                        currentImageIndex = -1;
                    }

                    if (newIndex !== currentImageIndex) {
                        switchToImage(newIndex);
                    }
                    lastChangeTime = now;
                }
                rafId = requestAnimationFrame(updateBackground);
            }

            function startAnimation() {
                if (rafId) cancelAnimationFrame(rafId);
                lastChangeTime = performance.now();
                rafId = requestAnimationFrame(updateBackground);
            }

            Promise.allSettled(imageFilenames.map(preloadImage)).then((results) => {
                shuffled = shuffleArray(
                    results
                        .filter(r => r.status === 'fulfilled' && r.value !== null)
                        .map(r => r.value)
                );

                if (shuffled.length === 0) return;

                layers[activeLayer].style.backgroundImage = `url('${shuffled[0]}')`;
                layers[activeLayer].style.opacity = '1';
                layers[1 - activeLayer].style.opacity = '0';
                currentImageIndex = 0;
                ready = true;
                startAnimation();
            });

            const audio = document.getElementById('bg-track');
            if (audio) {
                audio.play().catch(() => {
                    const playOnInteraction = () => {
                        audio.play().catch(() => {});
                        document.removeEventListener('click', playOnInteraction);
                        document.removeEventListener('touchstart', playOnInteraction);
                        document.removeEventListener('keydown', playOnInteraction);
                    };
                    document.addEventListener('click', playOnInteraction);
                    document.addEventListener('touchstart', playOnInteraction);
                    document.addEventListener('keydown', playOnInteraction);
                });

                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden && audio.paused) {
                        audio.play().catch(() => {});
                    }
                });
            }

            (function() {
                const CLICKS_NEEDED = 10;
                const RESET_TIMEOUT_MS = 4000;
                let clickCount = 0;
                let resetTimer = null;

                function isInteractiveTarget(el) {
                    return !!el.closest('a, audio, button, .budka, .doors-row, .center-link');
                }

                document.addEventListener('click', (e) => {
                    if (isInteractiveTarget(e.target)) {
                        clickCount = 0;
                        clearTimeout(resetTimer);
                        return;
                    }

                    clickCount++;
                    clearTimeout(resetTimer);
                    resetTimer = setTimeout(() => { clickCount = 0; }, RESET_TIMEOUT_MS);

                    if (clickCount >= CLICKS_NEEDED) {
                        clickCount = 0;
                        window.location.href = 'board.html';
                    }
                });
            })();
        })();
    </script>
</body>
</html>
